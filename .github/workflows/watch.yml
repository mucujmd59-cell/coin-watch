name: coin-watch

on:
  schedule:
    # GitHub Actions'ta en sik calisma araligi 5 dakikadir.
    # Yogun saatlerde birkac dakika gecikmeli calisabilir (GitHub tarafinin sinirlamasi).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coin-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: state.json degistiyse commit'le
        run: |
          git config user.name "coin-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --staged --quiet; then
              git commit -m "state guncelle"
              git pull --rebase --autostash || true
              git push
            else
              echo "state.json degismedi, commit atlaniyor."
            fi
          else
            echo "state.json olusturulmadi (bot.py erken cikmis olabilir), commit atlaniyor."
          fi
